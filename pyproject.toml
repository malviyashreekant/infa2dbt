[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infa2dbt"
version = "0.1.0"
description = "Convert Informatica PowerCenter XML mappings into a dbt project for Oracle"
requires-python = ">=3.10"
dependencies = [
  "lxml>=5.0",
  "pydantic>=2.0",
  "networkx>=3.0",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sqlfluff>=3.0"]

[project.scripts]
infa2dbt = "infa2dbt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
